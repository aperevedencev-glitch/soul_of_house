<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Нет соединения · Soul of Home</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E1C16">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
@font-face{font-family:'Manrope';src:url(fonts/manrope-cyrillic-wght-normal.woff2) format('woff2');font-weight:200 800;font-display:swap;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Manrope';src:url(fonts/manrope-latin-wght-normal.woff2) format('woff2');font-weight:200 800;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Fraunces';src:url(fonts/fraunces-latin-opsz-normal.woff2) format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#0E1C16;color:#F6F1E4;font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.6;display:grid;place-items:center;padding:24px;
  background-image:radial-gradient(circle at 78% 22%,rgba(199,154,70,.14),transparent 45%),radial-gradient(circle at 18% 82%,rgba(140,47,59,.18),transparent 45%)}
main{max-width:460px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.icon{width:120px;height:132px;animation:sway 5s ease-in-out infinite alternate;transform-origin:50% 0}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.brand{font-family:'Fraunces',Georgia,serif;font-size:18px;color:#E4C77E;display:flex;align-items:center;gap:8px}
.brand i{width:8px;height:8px;border-radius:50%;background:#C79A46;display:inline-block}
h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:34px;line-height:1.2}
p{color:rgba(246,241,228,.82);max-width:40ch}
button{font:inherit;font-weight:700;font-size:16px;min-height:48px;padding:0 28px;border:0;border-radius:99px;background:#C79A46;color:#0E1C16;cursor:pointer;display:inline-flex;align-items:center;gap:10px;margin-top:6px;transition:background .2s ease}
button:hover{background:#E4C77E}
button:focus-visible{outline:2px solid #E4C77E;outline-offset:3px}
.hint{font-size:14px;color:rgba(246,241,228,.6)}
@media (prefers-reduced-motion:reduce){.icon{animation:none}}
</style>
</head>
<body>
<main>
  <p class="brand"><i></i>Soul of Home</p>
  <svg class="icon" viewBox="0 0 100 124" role="img" aria-label="Ёлочный шар без сигнала">
    <path d="M50 0V13" stroke="#E4C77E" stroke-width="1.6"/><circle cx="50" cy="12" r="4" fill="none" stroke="#E4C77E" stroke-width="1.6"/>
    <rect x="41" y="15" width="18" height="11" rx="2" fill="#C79A46"/>
    <defs><radialGradient id="g" cx="36%" cy="34%" r="70%"><stop offset="0" stop-color="#3E8A63"/><stop offset="1" stop-color="#16281F"/></radialGradient></defs>
    <circle cx="50" cy="75" r="47" fill="url(#g)" stroke="rgba(228,199,126,.35)"/>
    <ellipse cx="34" cy="56" rx="11" ry="7" fill="#fff" opacity=".25" transform="rotate(-30 34 56)"/>
    <g fill="none" stroke="#E4C77E" stroke-width="3.2" stroke-linecap="round">
      <path d="M33 72a24 24 0 0 1 34 0"/><path d="M39 80a15 15 0 0 1 22 0"/><circle cx="50" cy="89" r="2.6" fill="#E4C77E" stroke="none"/>
      <path d="M30 60l40 40" stroke="#8C2F3B" stroke-width="4"/>
    </g>
  </svg>
  <h1>Нет соединения</h1>
  <p>Похоже, пропал интернет. Проверьте Wi-Fi или мобильную сеть — страница откроется, как только связь вернётся.</p>
  <button type="button" id="retry"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Попробовать снова</button>
  <p class="hint" id="state" role="status" aria-live="polite"></p>
</main>
<script>
(function(){
  var b = document.getElementById('retry'), st = document.getElementById('state');
  b.addEventListener('click', function(){ st.textContent = navigator.onLine ? 'Загружаем…' : 'Сети пока нет — пробуем ещё раз'; location.reload(); });
  window.addEventListener('online', function(){ st.textContent = 'Связь вернулась, загружаем…'; setTimeout(function(){ location.reload(); }, 400); });
})();
</script>
</body>
</html>
