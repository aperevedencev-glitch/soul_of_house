<main>
<section class="hero compact">
  <div class="hero-bg" aria-hidden="true"></div>
  <div class="wrap">
    <p class="crumbs"><a href="./">Главная</a> · Профиль</p>
    <p class="eyebrow light">Личный кабинет</p>
    <h1>Мой профиль</h1>
  </div>
</section>

<section class="profile-sec">
  <div class="wrap">
    <div class="profile-card" id="profileCard">
      <div class="pf-head">
        <div class="pf-avatar" id="pfAvatar" aria-hidden="true">?</div>
        <div>
          <p class="pf-name" id="pfTitle">Гость</p>
          <p class="pf-since">На сайте с <span id="pfSinceShort">—</span></p>
        </div>
      </div>

      <form id="profileForm" class="pf-form" novalidate>
        <div class="pf-row">
          <label for="pfName">Имя</label>
          <input id="pfName" name="name" type="text" autocomplete="name" maxlength="60" placeholder="Как к вам обращаться" readonly>
          <span class="pf-err" id="pfNameErr" hidden>Укажите имя</span>
        </div>
        <div class="pf-row">
          <label for="pfEmail">Email</label>
          <input id="pfEmail" name="email" type="email" autocomplete="email" maxlength="80" placeholder="name@example.ru" readonly>
          <span class="pf-err" id="pfEmailErr" hidden>Проверьте адрес: в нём должны быть «@» и точка</span>
        </div>
        <div class="pf-row">
          <span class="pf-label">Дата регистрации</span>
          <p class="pf-static" id="pfSince">—</p>
        </div>

        <div class="pf-actions">
          <button type="button" class="btn-dark" id="pfEdit">Редактировать</button>
          <button type="submit" class="btn-primary" id="pfSave" hidden>Сохранить</button>
          <button type="button" class="pf-cancel" id="pfCancel" hidden>Отмена</button>
          <p class="pf-status" id="pfStatus" role="status" aria-live="polite"></p>
        </div>
      </form>
      <p class="pf-note">Профиль хранится только в этом браузере: сайт не передаёт данные на сервер.</p>
    </div>
  </div>
</section>
</main>
<!--SCRIPT-->
<script>
(function(){
  var KEY = 'soh-profile';
  var mem = null;
  function load(){ try{ var v = JSON.parse(localStorage.getItem(KEY) || 'null'); if(v) return v; }catch(e){} return mem; }
  function store(v){ mem = v; try{ localStorage.setItem(KEY, JSON.stringify(v)); return true; }catch(e){ return false; } }
  var data = load();
  if(!data){ data = {name: '', email: '', since: new Date().toISOString()}; store(data); }

  var f = document.getElementById('profileForm'), nameI = document.getElementById('pfName'), mailI = document.getElementById('pfEmail');
  var av = document.getElementById('pfAvatar'), title = document.getElementById('pfTitle');
  var bEdit = document.getElementById('pfEdit'), bSave = document.getElementById('pfSave'), bCancel = document.getElementById('pfCancel'), status = document.getElementById('pfStatus');
  var COLORS = ['#16281F', '#8C2F3B', '#7A5A1E', '#1F4A36', '#5C3A5E', '#2F4B5C'];

  function initials(n){ var p = (n || '').trim().split(/\s+/).filter(Boolean); if(!p.length) return '?'; return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); }
  function color(n){ var h = 0; for(var k = 0; k < (n || '').length; k++) h = (h * 31 + n.charCodeAt(k)) >>> 0; return COLORS[h % COLORS.length]; }
  function paintAvatar(n){ av.textContent = initials(n); av.style.background = color((n || '').trim().toLowerCase()); }
  var dateFmt = function(iso, opts){ try{ return new Date(iso).toLocaleDateString('ru-RU', opts); }catch(e){ return iso.slice(0, 10); } };

  function render(){
    nameI.value = data.name; mailI.value = data.email;
    paintAvatar(data.name); title.textContent = data.name || 'Гость';
    document.getElementById('pfSince').textContent = dateFmt(data.since, {day: 'numeric', month: 'long', year: 'numeric'});
    document.getElementById('pfSinceShort').textContent = dateFmt(data.since, {month: 'long', year: 'numeric'});
  }
  function setEdit(on){
    f.classList.toggle('editing', on);
    [nameI, mailI].forEach(function(i){ i.readOnly = !on; });
    bEdit.hidden = on; bSave.hidden = !on; bCancel.hidden = !on;
    document.getElementById('pfNameErr').hidden = true; document.getElementById('pfEmailErr').hidden = true;
    if(on){ status.textContent = ''; nameI.focus(); }
  }
  bEdit.addEventListener('click', function(){ setEdit(true); });
  bCancel.addEventListener('click', function(){ render(); setEdit(false); status.textContent = 'Изменения отменены'; bEdit.focus(); });
  nameI.addEventListener('input', function(){ if(!nameI.readOnly) paintAvatar(nameI.value); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && f.classList.contains('editing')) bCancel.click(); });
  f.addEventListener('submit', function(e){
    e.preventDefault(); if(nameI.readOnly) return;
    var n = nameI.value.trim(), m = mailI.value.trim(), ok = true;
    document.getElementById('pfNameErr').hidden = !!n; if(!n) ok = false;
    var mailOk = !m || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m); document.getElementById('pfEmailErr').hidden = mailOk; if(!mailOk) ok = false;
    if(!ok){ (n ? mailI : nameI).focus(); return; }
    data = {name: n, email: m, since: data.since};
    var saved = store(data);
    render(); setEdit(false);
    status.textContent = saved ? 'Сохранено' : 'Сохранено до закрытия страницы';
    bEdit.focus();
  });
  render(); setEdit(false);
  if(!data.name) status.textContent = 'Заполните профиль — нажмите «Редактировать»';
})();
</script>
